name: Test Checkout & Bot Run

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Test Checkout URL
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - << 'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path

          state = json.loads(Path("ucash_state.json").read_text())
          url = state["resources"]["code_audit"]["checkout_url"]

          print(f"Probando: {url[:60]}...")
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode('utf-8', errors='ignore')
                  print(f"HTTP STATUS: {r.status}")
                  if "not available" in html.lower() or "contact the merchant" in html.lower():
                      print("RESULT: CHECKOUT BLOQUEADO (not available / contact merchant)")
                  elif "bitcoin" in html.lower() or "ethereum" in html.lower() or "usdc" in html.lower():
                      print("RESULT: CHECKOUT FUNCIONANDO (opciones de pago detectadas)")
                  else:
                      print("RESULT: HTML recibido pero no se detectaron metodos de pago claros")
                  print("\n--- Primeros 500 caracteres del HTML ---")
                  print(html[:500])
          except Exception as e:
              print(f"ERROR: {e}")
          PY
      - name: Run Bot for 3 minutes
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
          RUN_HOURS: '0.05'
          POLL_SECONDS: '15'
        run: python3 agent.py
