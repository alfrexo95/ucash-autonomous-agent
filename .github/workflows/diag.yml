name: U.CASH Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install agents-u-cash
      - name: Inspect SDK
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - << 'PY'
          import os, json, inspect
          from agents_u_cash import AgentsUCash

          agent = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])

          print("=== METODOS PUBLICOS DEL SDK ===")
          for name in sorted(dir(agent)):
              if name.startswith("_"): continue
              attr = getattr(agent, name)
              if callable(attr):
                  try:
                      print(f"{name}{inspect.signature(attr)}")
                  except Exception:
                      print(name)

          res_ids = [
              "res_chk_7378_1_bebf3e82441c",
              "res_chk_7378_2_bdecf5333a3e",
              "res_chk_7378_3_1fa62a3332e2",
          ]

          for method in ("get_resources","list_resources","resources"):
              if hasattr(agent, method):
                  print(f"\n=== {method}() ===")
                  try:
                      r = getattr(agent, method)()
                      print(json.dumps(r, indent=2, default=str)[:6000])
                  except Exception as e:
                      print(f"error: {type(e).__name__}: {e}")

          for method in ("get_resource","retrieve_resource","get_payment_resource","get_payment","get_checkout"):
              if hasattr(agent, method):
                  for rid in res_ids:
                      print(f"\n=== {method}('{rid}') ===")
                      try:
                          r = getattr(agent, method)(rid)
                          print(json.dumps(r, indent=2, default=str)[:4000])
                      except Exception as e:
                          print(f"error: {type(e).__name__}: {e}")
          PY
