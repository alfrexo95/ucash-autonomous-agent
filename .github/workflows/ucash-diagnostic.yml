name: Predator U.CASH - API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install U.CASH SDK
        run: |
          python -m pip install --disable-pip-version-check agents-u-cash==0.9.0

      - name: Inspect U.CASH endpoints
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          if [ -z "$UCASH_API_KEY" ]; then
            echo "ERROR: UCASH_API_KEY is not configured."
            exit 1
          fi

          python - <<'PY'
          import os
          from agents_u_cash import AgentsUCash

          client = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])

          def inspect_result(label, function):
              print("\n==========", label, "==========")
              try:
                  result = function()
                  print("SUCCESS")
                  print("TYPE:", type(result).__name__)

                  if isinstance(result, dict):
                      print("KEYS:", sorted(result.keys()))
                      for key, value in result.items():
                          print(
                              key,
                              "=>",
                              type(value).__name__,
                              "length:",
                              len(value) if isinstance(value, (list, dict)) else "-"
                          )

                  elif isinstance(result, list):
                      print("ITEMS:", len(result))
                      if result and isinstance(result[0], dict):
                          print("FIRST ITEM KEYS:", sorted(result[0].keys()))

              except Exception as error:
                  print("FAILED:", type(error).__name__)
                  print("STATUS:", getattr(error, "status", None))
                  print("ERROR CODE:", getattr(error, "code", None))

          inspect_result(
              "RESOURCES",
              lambda: client.get_resources()
          )

          inspect_result(
              "TRANSACTIONS",
              lambda: client.get_transactions(limit=5)
          )

          inspect_result(
              "SETTLEMENTS",
              lambda: client.get_settlements()
          )
          PY
