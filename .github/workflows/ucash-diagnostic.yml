name: Predator U.CASH - API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install U.CASH SDK
        run: python -m pip install --disable-pip-version-check agents-u-cash==0.9.0

      - name: Inspect all transaction statuses
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - <<'PYTHON'
          import os
          from agents_u_cash import AgentsUCash

          client = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])
          data = client.get_transactions(limit=100)
          transactions = data.get("transactions", [])

          print("TOTAL:", len(transactions))
          print("ID | STATUS | RESOURCE | ASSET | SETTLED | HASH")

          for tx in transactions:
              print(
                  tx.get("id"),
                  tx.get("status"),
                  tx.get("res_id"),
                  tx.get("asset"),
                  bool(tx.get("settled_at")),
                  bool(tx.get("tx_hash")),
                  sep=" | "
              )

          print("STATES:", sorted({
              str(tx.get("status")) for tx in transactions
          }))
          PYTHON
