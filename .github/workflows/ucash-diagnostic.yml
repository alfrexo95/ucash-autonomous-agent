name: Predator U.CASH - API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install U.CASH SDK
        run: python -m pip install --disable-pip-version-check agents-u-cash==0.9.0

      - name: Inspect payment acceptance
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - <<'PYTHON'
          import os
          import json
          from agents_u_cash import AgentsUCash

          client = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])

          resources = client.get_resources().get("resources", [])

          for r in resources:
              rid = r.get("res_id") or r.get("id")
              print("\\nRESOURCE:", rid)
              print("ACCEPTED_ASSETS:", r.get("accepted_assets"))

              door = client.get_payment_required(rid)

              print("DOOR_STATUS:", door.get("status"))
              print("ACCEPTS_TYPE:", type(door.get("accepts")).__name__)
              print("ACCEPTS:")
              print(json.dumps(
                  door.get("accepts"),
                  indent=2,
                  default=str
              ))

              required = door.get("payment_required")
              print("PAYMENT_REQUIRED_TYPE:", type(required).__name__)
              if isinstance(required, dict):
                  print("PAYMENT_REQUIRED_KEYS:", sorted(required.keys()))
          PYTHON
