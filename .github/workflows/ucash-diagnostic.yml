name: Predator U.CASH - API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install U.CASH SDK
        run: python -m pip install --disable-pip-version-check agents-u-cash==0.9.0

      - name: Inspect payment structures
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from agents_u_cash import AgentsUCash

          client = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])

          SAFE = {
              "id", "res_id", "resource_id", "checkout_id",
              "transaction_id", "settlement_id", "name",
              "status", "state", "payment_status",
              "amount", "price", "currency", "asset",
              "cryptocurrency", "network", "created_at",
              "updated_at", "settled_at", "type",
              "accepted_assets"
          }

          def inspect(label, fn, collection):
              print(f"\n===== {label} =====")
              try:
                  result = fn()
                  rows = result.get(collection, []) if isinstance(result, dict) else []
                  print("RESULT KEYS:", sorted(result.keys()) if isinstance(result, dict) else type(result).__name__)
                  print("RECORD COUNT:", len(rows) if isinstance(rows, list) else "not a list")

                  if isinstance(rows, list):
                      for index, row in enumerate(rows[:5]):
                          if not isinstance(row, dict):
                              continue
                          print(f"\nRECORD {index + 1} FIELDS:", sorted(row.keys()))
                          for key, value in row.items():
                              if key in SAFE and isinstance(value, (str, int, float, bool, list)):
                                  print(f"{key}: {value}")
                              elif "email" in key.lower():
                                  print(f"{key}: PRESENT" if value else f"{key}: EMPTY")
              except Exception as error:
                  print("FAILED:", type(error).__name__)
                  print("STATUS:", getattr(error, "status", None))
                  print("ERROR CODE:", getattr(error, "code", None))

          inspect("RESOURCES", client.get_resources, "resources")
          inspect("TRANSACTIONS", lambda: client.get_transactions(limit=10), "transactions")
          inspect("SETTLEMENTS", client.get_settlements, "settlements")
          PY
