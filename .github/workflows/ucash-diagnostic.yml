name: Predator U.CASH - Payment Data Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install --disable-pip-version-check agents-u-cash==0.9.0

      - name: Inspect transactions and settlements
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          from agents_u_cash import AgentsUCash

          client = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])

          def inspect(label, result):
              print("\n==========", label, "==========")
              print("TYPE:", type(result).__name__)

              if isinstance(result, dict):
                  print("TOP LEVEL KEYS:", list(result.keys()))

                  for key, value in result.items():
                      if isinstance(value, list):
                          print("\nLIST:", key, "COUNT:", len(value))
                          for item in value[:3]:
                              if isinstance(item, dict):
                                  print("RECORD KEYS:", list(item.keys()))
                                  print("SAMPLE:", json.dumps(
                                      item, indent=2, default=str
                                  )[:5000])
                              else:
                                  print("ITEM:", str(item)[:1000])
                      elif not isinstance(value, (dict, list)):
                          print(key, "=", str(value)[:300])
              else:
                  print(str(result)[:5000])

          inspect("TRANSACTIONS", client.get_transactions(limit=5))
          inspect("SETTLEMENTS", client.get_settlements())
          PY
