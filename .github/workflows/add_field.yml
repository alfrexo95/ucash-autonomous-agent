name: Add Custom Field
on: workflow_dispatch
jobs:
  add-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install agents-u-cash
      - env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - << 'PY'
          import os
          from agents_u_cash import AgentsUCash
          agent = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])
          try:
              agent.add_custom_field(
                  type="textarea",
                  label="Describe tu pedido (codigo, tema o automatizacion)",
                  required=True
              )
              print("CAMPO ANIADIDO CORRECTAMENTE")
          except Exception as e:
              print(f"Error: {e}")
          PY
