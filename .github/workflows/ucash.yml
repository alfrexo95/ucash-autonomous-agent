name: U.CASH Elite Autonomous Agent 24/7

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-ucash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests duckduckgo-search agents-u-cash

      - name: Run U.CASH Bot
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python3 agent.py
