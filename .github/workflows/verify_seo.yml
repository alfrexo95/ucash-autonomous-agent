name: Verify Worker SEO
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print SEO info
        run: |
          curl -s https://predator-x402-proxy.alfrexo95.workers.dev/openapi.json | python3 -c "
import json, sys
data = json.load(sys.stdin)
print('=== TITULO ===')
print(data['info']['title'])
print('\n=== DESCRIPCION SEO ===')
print(data['info']['description'])
print('\n=== TAGS ===')
for tag in data.get('tags', []):
    print(f'- {tag[\"name\"]}: {tag[\"description\"]}')
print('\n=== PRIMEROS 3 SERVICIOS ===')
for path, info in list(data['paths'].items())[:3]:
    print(f'{info[\"get\"][\"summary\"]}: {info[\"get\"][\"description\"]}')
"
