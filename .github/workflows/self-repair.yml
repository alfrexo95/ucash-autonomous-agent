name: Self-Repair
on:
  schedule:
    - cron: '0 3 * * *' # 3 AM todos los días (evita quemar la cuota gratuita)
  push:
    branches: ['self-repair/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: self-repair
  cancel-in-progress: false

jobs:
  ciclo-autonomo:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10', cache: 'pip', cache-dependency-path: 'requirements.txt'}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-qwen2.5-coder-3b-v4, restore-keys: hf-}
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Ciclo de auto-reparacion
        env: {MAX_SELF_REPAIRS: '1', REPAIR_COOLDOWN_HOURS: '12'}
        run: python self_repair.py --run
      - name: Mezclar ramas de reparacion validadas
        run: |
          git config user.name "ucash-agent"
          git config user.email "ucash-agent@users.noreply.github.com"
          git checkout master
          git pull --rebase origin master
          for BR in $(git branch -r --list 'origin/self-repair/*' | sed 's|origin/||'); do
            if git merge --no-ff "$BR" -m "auto: merge $BR (self-repair validado) [skip ci]"; then
              git push origin master || { git pull --rebase origin master && git push origin master; }
            else
              git merge --abort || true; echo "Conflicto en $BR: revision manual."
            fi
          done
      - name: Publicar estado
        if: always()
        run: |
          git config user.name "ucash-agent"
          git config user.email "ucash-agent@users.noreply.github.com"
          git add failures.json repair_log.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: self-repair state [skip ci]"
            git pull --rebase origin master && git push
          fi

  validar-y-mezclar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Tests unitarios
        run: python -m unittest discover -s tests -t . -v
      - name: Mezclar a master si los tests pasan
        run: |
          git config user.name "ucash-agent"
          git config user.email "ucash-agent@users.noreply.github.com"
          git checkout master
          git pull --rebase origin master
          if git merge --no-ff "origin/${{ github.ref_name }}" -m "auto: merge ${{ github.ref_name }} (self-repair validado) [skip ci]"; then
            for i in 1 2 3; do
              if git push origin master; then exit 0; fi
              git pull --rebase origin master; sleep 10
            done
            exit 1
          else
            git merge --abort || true; echo "Conflicto: revision manual."
          fi
