name: Multimodal Agent
on:
  workflow_dispatch:
# schedule:
    # - cron: '0 */2 * * *'
permissions:
  contents: write
concurrency:
  group: ucash-multimodal
  cancel-in-progress: false
jobs:
  run-multimodal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'multimodal/requirements.txt'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multimodal-v2
          restore-keys: hf-
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r multimodal/requirements.txt
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Register U.CASH multimodal agent with Predator Hub before processing
        continue-on-error: true
        env:
          HUB_TOKEN: ${{ secrets.INFRA_HUB_TOKEN }}
          HUB_URL: https://x402-api-wigc.onrender.com
        run: |
          if [ -z "${HUB_TOKEN:-}" ]; then echo "Hub registration skipped: token not configured"; exit 0; fi
          set -euo pipefail
          capabilities='["multimodal.analyze","vision","media","ocr_extractor","sentiment_analyzer","image_classifier","audio_transcriber","object_detector","smart_contract_auditor","text_translator","document_summarizer","ucash.agent"]'
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d "{\"agent_id\":\"ucash-multimodal-agent\",\"platform\":\"github-actions\",\"capabilities\":$capabilities}" \
            "$HUB_URL/infra/agents/register"
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$HUB_URL/infra/agents/ucash-multimodal-agent/heartbeat"
      - name: Run Multimodal Agent
        working-directory: ./multimodal
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
          RUN_HOURS: '0.20'
          POLL_SECONDS: '60'
        run: python3 agent.py
      - name: Register U.CASH Multimodal in Predator Hub (optional)
        continue-on-error: true
        env:
          HUB_TOKEN: ${{ secrets.INFRA_HUB_TOKEN }}
          HUB_URL: https://x402-api-wigc.onrender.com
        run: |
          if [ -z "${HUB_TOKEN:-}" ]; then echo "Hub registration skipped: token not configured"; exit 0; fi
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"agent_id":"ucash-multimodal-agent","platform":"github-actions","capabilities":["multimodal.analyze","vision","media","ocr_extractor","sentiment_analyzer","image_classifier","audio_transcriber","object_detector","smart_contract_auditor","text_translator","document_summarizer","ucash.agent"]}' \
            "$HUB_URL/infra/agents/register"
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$HUB_URL/infra/agents/ucash-multimodal-agent/heartbeat"
          # Read-only MCP discovery; no paid service routes are invoked.
          services_payload='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_services","arguments":{}}}'
          routes_payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_routes","arguments":{}}}'
          curl -fsS --max-time 20 -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" -d "$services_payload" "$HUB_URL/mcp" -o /tmp/hub-services.json
          curl -fsS --max-time 20 -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" -d "$routes_payload" "$HUB_URL/mcp" -o /tmp/hub-routes.json
          python3 - <<'PY'
          import json
          services=json.load(open("/tmp/hub-services.json"))["result"]["structuredContent"]["services"]
          routes=json.load(open("/tmp/hub-routes.json"))["result"]["structuredContent"]["routes"]
          print(f"MCP catalog discovery: {len(services)} services/workers, {len(routes)} route definitions.")
          PY

      - name: Commit deliveries and state
        if: always()
        run: |
          git config user.name "multimodal-bot"
          git config user.email "multimodal@users.noreply.github.com"
          git add multimodal/deliveries/ multimodal/ucash_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: multimodal delivery [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin master && git push; then break; fi
              echo "push ocupado, reintentando ($i)..."; sleep 10
            done
          fi
