name: Multimodal Agent
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

# Permisos necesarios para que el bot pueda guardar el ucash_state.json
permissions:
  contents: write

jobs:
  run-multimodal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'multimodal/requirements.txt'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r multimodal/requirements.txt
          
      - name: Run Multimodal Agent
        working-directory: ./multimodal
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: python3 agent.py
        
      - name: Commit deliveries and state
        if: always()
        run: |
          git config user.name "multimodal-bot"
          git config user.email "multimodal@users.noreply.github.com"
          git add multimodal/deliveries/ multimodal/ucash_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: multimodal delivery [skip ci]"
            git push
          fi
