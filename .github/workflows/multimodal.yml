name: Multimodal Agent
on:
  workflow_dispatch:
# schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: write
concurrency:
  group: ucash-multimodal
  cancel-in-progress: false
jobs:
  run-multimodal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'multimodal/requirements.txt'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multimodal-v2
          restore-keys: hf-
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r multimodal/requirements.txt
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Run Multimodal Agent
        working-directory: ./multimodal
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
          RUN_HOURS: '0.23'
          POLL_SECONDS: '60'
        run: python3 agent.py
      - name: Commit deliveries and state
        if: always()
        run: |
          git config user.name "multimodal-bot"
          git config user.email "multimodal@users.noreply.github.com"
          git add multimodal/deliveries/ multimodal/ucash_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: multimodal delivery [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin master && git push; then break; fi
              echo "push ocupado, reintentando ($i)..."; sleep 10
            done
          fi
