name: U.CASH agent tests
on:
  push:
    branches: [master]
    paths:
      - "agent.py"
      - "multimodal/agent.py"
      - "core_logic.py"
      - "ucash_state.json"
      - "multimodal/ucash_state.json"
      - "tests/**"
      - ".github/workflows/agent-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "agent.py"
      - "multimodal/agent.py"
      - "core_logic.py"
      - "ucash_state.json"
      - "multimodal/ucash_state.json"
      - "tests/**"
      - ".github/workflows/agent-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
