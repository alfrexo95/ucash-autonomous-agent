name: Debug U.CASH API
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Raw API Test
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          echo "=== 1. INFORMACION DE LA CUENTA ==="
          curl -s -H "X-Api-Key: $UCASH_API_KEY" "https://agents.u.cash/v1/agent"
          
          echo -e "\n\n=== 2. LISTA DE TODOS LOS RECURSOS ==="
          curl -s -H "X-Api-Key: $UCASH_API_KEY" "https://agents.u.cash/v1/resources"
          
          echo -e "\n\n=== 3. BUSCAR UN RECURSO ESPECIFICO (res_chk_7378_1) ==="
          curl -s -H "X-Api-Key: $UCASH_API_KEY" "https://agents.u.cash/v1/resources?res_id=res_chk_7378_1_bebf3e82441c"
          
          echo -e "\n\n=== 4. HISTORIAL DE TRANSACCIONES ==="
          curl -s -H "X-Api-Key: $UCASH_API_KEY" "https://agents.u.cash/v1/transactions?limit=5"
