name: U.CASH Activate Free Credit

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Redeem UCASH via API
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          python - << 'PY'
          import os, json, urllib.request, urllib.error

          api_key = os.environ["UCASH_API_KEY"]
          base = "https://agents.u.cash"
          headers = {
              "X-Api-Key": api_key,
              "Content-Type": "application/json",
              "Accept": "application/json"
          }

          def api_call(path, payload=None, method="POST"):
              url = base + path
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          print("=== 1. Estado actual ===")
          code, body = api_call("/v1/agent", method="GET")
          print(f"HTTP {code}: {json.dumps(body, indent=2) if isinstance(body, dict) else body}")

          print("\n=== 2. Canjeando 120 UCASH ===")
          payload = {"action": "redeem-ucash", "amount": 120}
          code, body = api_call("/v1/billing", payload)
          print(f"HTTP {code}: {json.dumps(body, indent=2) if isinstance(body, dict) else body}")

          print("\n=== 3. Estado final ===")
          code, body = api_call("/v1/agent", method="GET")
          print(f"HTTP {code}: {json.dumps(body, indent=2) if isinstance(body, dict) else body}")
          PY
