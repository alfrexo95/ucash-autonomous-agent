name: U.CASH Elite Open-Source AI Agent 24/7

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ucash-agent
  cancel-in-progress: false

jobs:
  run-ucash:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-1.5b-v1
          restore-keys: |
            hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Open-Source AI Agent
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
          RUN_HOURS: '5.4'
          POLL_SECONDS: '120'
        run: python3 agent.py

      - name: Save state and deliveries
        if: always()
        run: |
          git config user.name "ucash-agent"
          git config user.email "ucash-agent@users.noreply.github.com"
          git add ucash_state.json deliveries/ || true
          if ! git diff --cached --quiet; then
            git commit -m "state: update ledger and deliveries [skip ci]"
            git push
          fi
