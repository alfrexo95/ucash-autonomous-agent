name: U.CASH Elite Agent
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ucash-agent
  cancel-in-progress: false
jobs:
  run-ucash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-coder-3b-v4
          restore-keys: hf-
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Register U.CASH agent with Predator Hub before processing
        continue-on-error: true
        env:
          HUB_TOKEN: ${{ secrets.INFRA_HUB_TOKEN }}
          HUB_URL: https://x402-api-wigc.onrender.com
        run: |
          if [ -z "${HUB_TOKEN:-}" ]; then echo "Hub registration skipped: token not configured"; exit 0; fi
          set -euo pipefail
          capabilities='["ucash.agent","ucash.marketplace.fulfillment","marketplace","delivery"]'
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d "{\"agent_id\":\"ucash-autonomous-agent\",\"platform\":\"github-actions\",\"capabilities\":$capabilities}" \
            "$HUB_URL/infra/agents/register"
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$HUB_URL/infra/agents/ucash-autonomous-agent/heartbeat"
      - name: Run Agent
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
          RUN_HOURS: '0.20'
          POLL_SECONDS: '60'
        run: python3 agent.py
      - name: Commit deliverables and state
        if: always()
        run: |
          git config user.name "ucash-agent"
          git config user.email "ucash-agent@users.noreply.github.com"
          git add deliveries/ ucash_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: delivery update [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin master && git push; then break; fi
              echo "push ocupado, reintentando ($i)..."; sleep 10
            done
          fi
