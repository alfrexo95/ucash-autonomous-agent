name: U.CASH Elite Agent

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ucash-agent
  cancel-in-progress: false

jobs:
  run-ucash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-1.5b-v3
          restore-keys: |
            hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Agent (14 min)
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
          RUN_HOURS: '0.23'
          POLL_SECONDS: '60'
        run: python3 agent.py

      - name: Commit deliverables and state
        if: always()
        run: |
          git config user.name "ucash-agent"
          git config user.email "ucash-agent@users.noreply.github.com"
          git add deliveries/ ucash_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: delivery update [skip ci]"
            git push
          fi
