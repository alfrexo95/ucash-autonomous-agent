name: U.CASH Setup Payments

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install agents-u-cash
      - name: Configure wallets and regenerate resources
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
          BTC_ADDRESS: "bc1qt3rukpe7qp737zj5j5xpxxmcqv90cfefhg5e00"
          EVM_ADDRESS: "0xA5E6eB31868A85127B1ED82b8C760193356206ED"
        run: |
          python - << 'PY'
          import os, json
          from agents_u_cash import AgentsUCash

          agent = AgentsUCash(api_key=os.environ["UCASH_API_KEY"])

          print("=== 1. Configurando direcciones de recepcion ===")
          for asset, addr in [("btc", os.environ["BTC_ADDRESS"]),
                              ("eth", os.environ["EVM_ADDRESS"]),
                              ("usdc_base", os.environ["EVM_ADDRESS"])]:
              try:
                  r = agent.set_wallet(asset, addr)
                  print(f"  {asset}: OK -> {addr[:10]}...")
              except Exception as e:
                  print(f"  {asset}: ERROR -> {e}")

          print("\n=== 2. Verificando configuracion ===")
          try:
              ag = agent.get_agent()
              print(json.dumps(ag, indent=2, default=str)[:2000])
          except Exception as e:
              print(f"  get_agent error: {e}")

          print("\n=== 3. Verificando recursos existentes ===")
          try:
              r = agent.get_resources()
              items = r.get("response", r) if isinstance(r, dict) else r
              if isinstance(items, list):
                  for res in items:
                      print(f"  {res.get('res_id')} | {res.get('title')} | checkout={res.get('checkout_url','')[:60]}...")
              else:
                  print(json.dumps(items, indent=2, default=str)[:2000])
          except Exception as e:
              print(f"  get_resources error: {e}")

          print("\n=== 4. Si el checkout sigue vacio, regenerar recursos ===")
          # Solo si es necesario; comenta esta seccion si prefieres no tocar nada
          # accepted_assets=["btc","eth","usdc_base"]
          PY
